[pytest]
markers =
    integration: requires a real Postgres instance (DATABASE_URL) -- see scripts/dev-db.sh
    fraud_eval: hits the live NVIDIA API with real cost/time -- opt-in only, run with AMM_RUN_FRAUD_EVAL=1 (see docs/decisions/0021)
    ebay_fp_eval: false-positive stress test against real eBay listing titles -- opt-in, real API cost/time, requires a local fixture file (see docs/decisions/0023)
testpaths = tests
pythonpath = .
