name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  checks:
    name: pre-commit + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres -- listing_embeddings needs the vector
        # extension (ADR 0010), same image as scripts/dev-db.sh uses locally.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: amm
          POSTGRES_PASSWORD: amm
          POSTGRES_DB: moderator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://amm:amm@localhost:5432/moderator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply schema
        run: psql "$DATABASE_URL" -f schema.sql

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Run test suite
        # DATABASE_URL is set above, so integration tests run for real here, not
        # skipped. No NVIDIA_API_KEY needed -- none of them call a live model
        # (they exercise db.py/cli/tools.py directly, not pipeline.run_fusion).
        run: pytest -v
